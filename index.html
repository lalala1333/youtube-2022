<!DOCTYPE html>
<html>
<head>
    <title>My Page</title>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
          rel="stylesheet">
</head>
<body>

<div class="grid-container">
    <header class="header">
        <div class="left-header">
            <div class="menu-container">
                <img class="menu-img" src="svg/hamburger-menu.svg">
                <div class="tooltip">Menu</div>
            </div>
            <div class="youtube-container">
                <img class="logo-img" src="svg/youtube-logo.svg">
                <div class="tooltip">Homepage</div>
            </div>
        </div>
        <div class="mid-header">
            <div class="search-bar-container">
                <input class="search-bar" placeholder="Search">
                <button class="search-button">
                    <img class="search-button-img" src="svg/search.svg">
                    <div class="tooltip">Search</div>
                </button>
            </div>
            <button class="voice-search-button">
                <img class="voice-search-button-img" src="svg/voice-search-icon.svg">
                <div class="tooltip">Search with your voice</div>
            </button>
        </div>
        <div class="right-header">
            <div class="upload-container">
                <img class="upload" src="svg/upload.svg">
                <div class="tooltip">Create</div>
            </div>
            <div class="youtube-apps-container">
                <img class="youtube-apps" src="svg/youtube-apps.svg">
                <div class="tooltip">YouTube apps</div>
            </div>
            <div class="notifications-container">
                <img class="notifications" src="svg/notifications.svg">
                <div class="tooltip">Notifications</div>
                <div class="message-count">3</div>
            </div>
            <img class="profile" src="svg/images.jpg">
        </div>
    </header>
    <aside class="aside">
        <div class="flex-item">
            <img class="home-img" src="svg/home.svg">
            <p class="home-text">Home</p>
        </div>
        <div class="flex-item">
            <img class="explore-img" src="svg/explore.svg">
            <p class="explore-text">Explore</p>
        </div>
        <div class="flex-item">
            <img class="subscriptions-img" src="svg/subscriptions.svg">
            <p class="subscriptions-text">Subscriptions</p>
        </div>
        <div class="flex-item">
            <img class="originals-img" src="svg/originals.svg">
            <p class="originals-text">Originals</p>
        </div>
        <div class="flex-item">
            <img class="youtube-music-img" src="svg/youtube-music.svg">
            <p class="youtube-music-text">YouTube Music</p>
        </div>
        <div class="flex-item">
            <img class="library-img" src="svg/library.svg">
            <p class="library-text">Library</p>
        </div>
    </aside>
    <main class="main">
        <div class="grid-item">
            <div class="thumbnail-container">
                <a href="https://www.youtube.com/watch?v=n2RNcPRtAiY">
                    <img class="thumbnail" src="svg/thumbnail-1.webp">
                </a>
                <span class="timestamp">14:20</span>
            </div>
            <div class="metadata">
                <div class="left">
                    <a class="logo-link" href="https://www.youtube.com/user/marquesbrownlee">
                        <img class="author-logo" src="svg/images.jpg">
                        <div class="author-tooltip">
                            <img class="tooltip-logo" src="svg/channels4_profile.jpg">
                            <div class="inner-flex">
                                <p class="author">Marques Brownlee</p>
                                <p class="subs">15M subscribers</p>
                            </div>
                        </div>
                    </a>
                </div>
                <div class="right">
                    <p class="title"><a href="https://www.youtube.com/watch?v=n2RNcPRtAiY">Talking Tech and AI with Google CEO Sundar Pichai!</a></p>
                    <p class="author-name">Marques Brownlee</p>
                    <p class="views-date">3.4M views · 6 months ago</p>
                </div>
            </div>
        </div>
    </main>
</div>

</body>
</html>
